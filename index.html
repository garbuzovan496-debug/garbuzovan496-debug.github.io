<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог решений | AI / WEB / AUTOMATION</title>
    <style>
        :root { --bg: #0a0a0a; --card-bg: #111; --text: #fff; --accent-green: #10b981; --accent-blue: #2563eb; --accent-orange: #f97316; --accent-purple: #a855f7; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 40px 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; font-size: 2.5rem; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #888; margin-bottom: 50px; }
        
        /* Сетка карточек */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 30px; }
        
        /* Карточка */
        .card { background: var(--card-bg); border-radius: 16px; overflow: hidden; border: 1px solid #222; transition: transform 0.3s; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-5px); border-color: #444; }
        .card-img { width: 100%; height: 200px; object-fit: cover; border-bottom: 1px solid #222; }
        .card-body { padding: 25px; flex-grow: 1; display: flex; flex-direction: column; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; margin-bottom: 15px; width: fit-content; }
        .badge-green { background: rgba(16, 185, 129, 0.1); color: var(--accent-green); }
        .badge-blue { background: rgba(37, 99, 235, 0.1); color: var(--accent-blue); }
        .badge-orange { background: rgba(249, 115, 22, 0.1); color: var(--accent-orange); }
        .badge-purple { background: rgba(168, 85, 247, 0.1); color: var(--accent-purple); }
        
        h3 { margin: 0 0 15px 0; font-size: 1.4rem; }
        ul.features { list-style: none; padding: 0; margin: 0 0 25px 0; flex-grow: 1; }
        ul.features li { margin-bottom: 8px; color: #ccc; font-size: 0.95rem; }
        
        /* Кнопки */
        .card-actions { display: flex; gap: 10px; margin-top: auto; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; text-align: center; text-decoration: none; font-size: 0.9rem; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-primary { background: #fff; color: #000; }
        .btn-secondary { background: #222; color: #fff; border: 1px solid #333; }
        
        /* Уведомление о копировании */
        #toast { visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center; border-radius: 8px; padding: 16px; position: fixed; z-index: 1; left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 17px; }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

<div class="container">
    <h1>Каталог решений</h1>
    <p class="subtitle">Готовые ИИ-инструменты и веб-сервисы под ключ. Каждый проект можно открыть в демо.</p>
    
    <div class="grid">
        <!-- 01. AI-Юрист -->
        <div class="card">
            <img src="cover-ai-jurist.png" alt="AI Юрист" class="card-img">
            <div class="card-body">
                <span class="badge badge-green">ЖКХ и Юристы</span>
                <h3>Консультант кнопками 24/7</h3>
                <ul class="features">
                    <li>✅ Быстрые кнопки частых проблем</li>
                    <li>✅ Ответы со ссылками на статьи ЖК РФ</li>
