<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Каталог решений — AI-инструменты и веб-сервисы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#F4F5F7; --card-bg:#FFFFFF; --text:#1A1D22; --muted:#6B7280;
    --light:#9CA3AF; --border:#E8EAED; --border-soft:#F0F1F3;
    --accent:#2563EB; --green:#059669; --orange:#EA580C; --red:#DC2626;
    --purple:#7C3AED; --teal:#0D9488;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
    --shadow-h:0 10px 30px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.04);
  }
  body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}

  .page-header{background:#fff;border-bottom:1px solid var(--border);padding:16px 0}
  .header-inner{max-width:1200px;margin:0 auto;padding:0 32px;display:flex;align-items:center;justify-content:space-between}
  .logo{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}
  .logo-icon{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:800}
  .header-meta{font-size:13px;color:var(--muted)}

  .main{max-width:1200px;margin:0 auto;padding:36px 32px 56px}
  .catalog-title{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
  .catalog-subtitle{font-size:14px;color:var(--muted);margin-bottom:28px}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}

  .card{background:var(--card-bg);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);transition:box-shadow .2s,transform .2s;display:flex;flex-direction:column;border:1px solid var(--border-soft)}
  .card:hover{box-shadow:var(--shadow-h);transform:translateY(-3px)}

  .preview{height:178px;overflow:hidden;position:relative;border-bottom:1px solid var(--border-soft)}
  .preview-number{position:absolute;top:10px;left:12px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:rgba(255,255,255,.75);background:rgba(0,0,0,.3);padding:2px 8px;border-radius:5px;z-index:5;letter-spacing:.05em;backdrop-filter:blur(4px)}
  .preview-light .preview-number{color:rgba(0,0,0,.45);background:rgba(255,255,255,.8)}

  .card-content{padding:18px 20px 20px;display:flex;flex-direction:column;flex:1}
  .badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;margin-bottom:10px;width:fit-content}
  .badge-blue{background:#EFF6FF;color:#2563EB}
  .badge-dark{background:#F1F5F9;color:#475569}
  .badge-green{background:#ECFDF5;color:#059669}
  .badge-orange{background:#FFF7ED;color:#EA580C}
  .badge-teal{background:#F0FDFA;color:#0D9488}
  .badge-purple{background:#F5F3FF;color:#7C3AED}

  .card-title{font-size:18px;font-weight:800;letter-spacing:-.01em;margin-bottom:12px;line-height:1.25}

  .bullets{list-style:none;margin-bottom:16px;flex:1}
  .bullets li{font-size:13px;color:#4B5563;padding:5px 0 5px 24px;position:relative;line-height:1.4}
  .bullets li::before{content:"";position:absolute;left:0;top:9px;width:15px;height:15px;border-radius:50%;background:#ECFDF5}
  .bullets li::after{content:"";position:absolute;left:4px;top:12px;width:7px;height:4px;border-left:2px solid #059669;border-bottom:2px solid #059669;transform:rotate(-45deg)}

  .card-buttons{display:flex;gap:8px}
  .btn{flex:1;padding:9px 12px;border-radius:8px;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px;font-family:inherit;text-decoration:none}
  .btn-primary{background:var(--text);color:#fff}
  .btn-primary:hover{background:#000}
  .btn-secondary{background:#F3F4F6;color:var(--text);border:1px solid var(--border)}
  .btn-secondary:hover{background:#E8EAED}
  .btn-secondary.copied{background:#ECFDF5;color:#059669;border-color:#A7F3D0}

  /* === Mockup Styles === */
  .mk-zhkh{background:linear-gradient(180deg,#1E40AF,#2563EB);padding:8px;height:100%;display:flex;flex-direction:column;gap:6px}
  .mk-zhkh .h{color:#fff;font-size:9px;font-weight:700;padding:4px 8px;display:flex;justify-content:space-between;align-items:center}
  .mk-zhkh .chat{background:rgba(255,255,255,.96);border-radius:7px;padding:7px;flex:1;display:flex;flex-direction:column;gap:4px}
  .mk-zhkh .b{font-size:8px;padding:4px 7px;border-radius:5px;line-height:1.3}
  .mk-zhkh .bot{background:#DBEAFE;color:#1E40AF;align-self:flex-start}
  .mk-zhkh .usr{background:#FEF3C7;color:#92400E;align-self:flex-end}
  .mk-zhkh .btns{display:flex;gap:3px;flex-wrap:wrap}
  .mk-zhkh .qb{font-size:7px;padding:2px 6px;border-radius:4px;background:#2563EB;color:#fff;font-weight:600}

  .mk-audit{background:#0F172A;padding:8px;height:100%;display:flex;flex-direction:column;gap:4px}
  .mk-audit .h{color:#94A3B8;font-size:8px;padding:3px 6px;display:flex;justify-content:space-between;border-bottom:1px solid #1E293B}
  .mk-audit .doc{flex:1;background:#1E293B;border-radius:5px;padding:6px;display:flex;flex-direction:column;gap:3px}
  .mk-audit .ln{height:5px;border-radius:2px;background:#334155}
  .mk-audit .ln-r{background:rgba(220,38,38,.25);border:1px solid rgba(220,38,38,.4)}
  .mk-audit .flag{font-size:7px;color:#FCA5A5;padding:1px 5px;background:rgba(220,38,38,.15);border-radius:3px;width:fit-content;font-weight:600}

  .mk-dash{background:#F8FAFC;padding:8px;height:100%;display:flex;flex-direction:column;gap:5px}
  .mk-dash .h{font-size:8px;color:#64748B;padding:2px 4px;font-weight:600}
  .mk-dash .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .mk-dash .kpi{background:#fff;border:1px solid #E2E8F0;border-radius:5px;padding:4px 5px}
  .mk-dash .kl{font-size:6px;color:#94A3B8}
  .mk-dash .kv{font-size:10px;font-weight:800}
  .mk-dash .chart{background:#fff;border:1px solid #E2E8F0;border-radius:5px;padding:6px;flex:1;display:flex;align-items:flex-end;gap:3px}
  .mk-dash .bar{flex:1;border-radius:2px 2px 0 0}

  .mk-sort{background:#F8FAFC;padding:8px;height:100%;display:flex;gap:6px}
  .mk-sort .col{flex:1;display:flex;flex-direction:column;gap:3px}
  .mk-sort .ct{font-size:7px;font-weight:700;color:#64748B;padding:2px 4px}
  .mk-sort .em{background:#fff;border:1px solid #E2E8F0;border-radius:4px;padding:3px 5px;font-size:7px;line-height:1.3}
  .mk-sort .em.hot{border-color:#FCA5A5;background:#FEF2F2}
  .mk-sort .em.spam{border-color:#D1D5DB;background:#F9FAFB;opacity:.55}
  .mk-sort .arr{display:flex;flex-direction:column;justify-content:center;gap:9px;font-size:11px;color:#CBD5E1}

  .mk-calc{background:#fff;padding:8px;height:100%;display:flex;flex-direction:column;gap:5px}
  .mk-calc .h{background:#0D9488;color:#fff;font-size:8px;font-weight:700;padding:4px 8px;border-radius:5px}
  .mk-calc .f{display:flex;justify-content:space-between;padding:4px 7px;background:#F0FDFA;border-radius:4px;font-size:8px;border:1px solid #CCFBF1}
  .mk-calc .fl{color:#64748B}
  .mk-calc .fv{font-weight:700;color:#0F172A}
  .mk-calc .r{background:#0D9488;color:#fff;padding:6px 8px;border-radius:6px;text-align:center}
  .mk-calc .rl{font-size:7px;opacity:.8}
  .mk-calc .rv{font-size:15px;font-weight:800}
  .mk-calc .tg{display:flex;align-items:center;justify-content:center;gap:4px;font-size:7px;color:#2563EB;padding:3px;border:1px dashed #93C5FD;border-radius:4px;font-weight:600}

  .mk-art{background:#fff;padding:10px;height:100%;display:flex;flex-direction:column;gap:4px}
  .mk-art .tag{font-size:6px;color:#7C3AED;font-weight:700}
  .mk-art .t{font-size:10px;font-weight:800;line-height:1.2;color:#1A1D22}
  .mk-art .ln{height:4px;border-radius:2px;background:#E5E7EB}
  .mk-art .s{width:80%}.mk-art .m{width:60%}
  .mk-art .tags{display:flex;gap:3px;margin-top:2px}
  .mk-art .chip{font-size:6px;padding:1px 5px;border-radius:3px;font-weight:700}
  .mk-art .g{background:#ECFDF5;color:#059669}
  .mk-art .p{background:#F5F3FF;color:#7C3AED}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:#1A1D22;color:#fff;padding:11px 20px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform
